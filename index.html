<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustafa's Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="calculator glass p-4 rounded-4 shadow-lg text-center">
        <input type="text" id="result" class="form-control mb-3 text-end fs-4" disabled />

        <div class="row g-2">
            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('1')">1</button></div>
            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('2')">2</button></div>
            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('3')">3</button></div>
            <div class="col-3" ><button class="btn btn-warning w-100" onclick="setOperation('+')">+</button></div>

            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('4')">4</button></div>
            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('5')">5</button></div>
            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('6')">6</button></div>
            <div class="col-3" ><button class="btn btn-warning w-100" onclick="setOperation('-')">-</button></div>

            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('7')">7</button></div>
            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('8')">8</button></div>
            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('9')">9</button></div>
            <div class="col-3" ><button class="btn btn-warning w-100" onclick="setOperation('*')">*</button></div>

            <div class="col-3" ><button class="btn btn-danger w-100" onclick="clearResult()">C</button></div>
            <div class="col-3" ><button class="btn btn-outline-light w-100" onclick="appendNumber('0')">0</button></div>
            <div class="col-3" ><button class="btn btn-success w-100" onclick="calculateResult()">=</button></div>
            <div class="col-3" ><button class="btn btn-warning w-100" onclick="setOperation('/')">/</button></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
